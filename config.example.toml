# Sao chép file này thành config.toml rồi sửa.
#
# Các mục riêng từng website (site_url, ga4_property, brand_terms, [rank], [okr]) chỉ dùng để tạo DỰ ÁN ĐẦU TIÊN khi
# tool chạy lần đầu. Sau đó thêm và sửa website ở màn Quản trị → Dự án.

# Property trong Search Console của website đầu tiên, viết đúng như lệnh `python -m seo_report login` liệt kê.
# Domain property: "sc-domain:tenmien.com"; URL-prefix property: "https://tenmien.com/"
site_url = "sc-domain:tenmien.com"

# GA4 property cho phần AI Search & GEO và lượt truy cập, dạng "properties/123456789" (lệnh login liệt kê sẵn).
ga4_property = ""

db_path = "data/seo.db"
client_secret = "secrets/client_secret.json"
token_path = "secrets/token.json"

# Lần đầu lấy bù bao nhiêu tháng (GSC giữ tối đa 16 tháng).
backfill_months = 16
# Mỗi lần chạy lấy lại bao nhiêu ngày gần nhất, vì GSC còn cập nhật số liệu 2–3 ngày.
refetch_days = 5

[keywords]
# Head KW và keyword phụ tính trên bao nhiêu ngày gần nhất (ổn định hơn tính theo tuần).
window_days = 28
# Keyword phụ phải có ít nhất bấy nhiêu impression trong khoảng trên, và position trung bình không quá max_position.
min_impressions = 50
max_position = 30
max_secondary = 5
# Từ khóa thương hiệu: query chứa các từ này (không phân biệt dấu, khoảng trắng) bị loại khỏi head/keyword phụ.
brand_terms = []  # ví dụ ["abc", "congtyabc"]

[rank]
# Ngân sách check rank mỗi tháng (USD) của website đầu tiên. Không gắn được ★ khi ước tính vượt mức này.
monthly_budget_usd = 20
# Giá DataForSEO chế độ standard cho mỗi trang 10 kết quả. Kiểm tra lại khi DataForSEO đổi giá.
price_per_page = 0.0006
# 2704 = Việt Nam, toàn quốc. Thiết bị: mobile.
location_code = 2704
language_code = "vi"
device = "mobile"

[okr]
# Google Sheet OKR / Weekly Task Tracker cho báo cáo công việc (tool chỉ đọc). Dán link sheet.
sheet = ""
okr_tab = "OKRs 3 tháng"
weekly_tab = "Weekly Task Tracker"

[access]
# Quản trị dự phòng: email trong editors luôn là quản trị mọi website (không gỡ được trên màn Phân quyền).
# Người khác thêm ở màn Quản trị → Phân quyền. Mở thẳng trên máy chạy tool luôn có toàn quyền.
editors = []
viewers = []  # cách cũ: email chỉ xem website đầu tiên; tool tự chuyển vào màn Phân quyền
team_domain = ""  # Cloudflare Access (không bắt buộc), ví dụ "congty.cloudflareaccess.com"
aud = ""  # Application Audience (AUD) tag của ứng dụng trong Cloudflare Access
